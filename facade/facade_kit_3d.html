ctrl.target.copy(bs.center); cam.position.set(bs.center.x+bs.radius*1.1,bs.center.y+bs.radius*0.3,bs.center.z+bs.radius*1.3);
ctrl.update();
document.querySelectorAll('.seg[data-mode]').forEach(b=>b.addEventListener('click',()=>{
  const wasOn=b.classList.contains('on');
  document.querySelectorAll('.seg[data-mode]').forEach(x=>x.classList.remove('on'));
  curMode = wasOn ? 3 : +b.dataset.mode;   // re-click returns to Default (3)
  if(!wasOn) b.classList.add('on');
  selected=null; document.getElementById('sel').textContent='';
  hideInset(); dimContext(false); recolor(curMode);
}));
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rnd.setSize(innerWidth,innerHeight);});

// --- context geometry: windows + massing (toggleable) ---
function buildCtx(kind,color,opacity){
  const its=(D.context||[]).filter(c=>c.kind===kind);
  if(!its.length) return null;
  let nv=0,nt=0; its.forEach(c=>{nv+=c.v.length;nt+=c.t.length;});
  const pos=new Float32Array(nv*3),ix=new Uint32Array(nt*3); let vo=0,io=0;
  its.forEach(c=>{const st=vo;
    c.v.forEach(v=>{pos[vo*3]=v[0];pos[vo*3+1]=v[2];pos[vo*3+2]=-v[1];vo++;});
    c.t.forEach(t=>{ix[io*3]=st+t[0];ix[io*3+1]=st+t[1];ix[io*3+2]=st+t[2];io++;});});
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setIndex(new THREE.BufferAttribute(ix,1));
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:color,transparent:opacity<1,
    opacity:opacity,roughness:0.85,metalness:0.0,side:THREE.DoubleSide,depthWrite:opacity>=0.9,
    flatShading:true,polygonOffset:true,polygonOffsetFactor:4,polygonOffsetUnits:4})); // push behind panels
  scene.add(m);
  if(kind!=='mass'){  // mass uses brep edges (added separately); windows get mesh edges
    const el=new THREE.LineSegments(new THREE.EdgesGeometry(g,40),
      new THREE.LineBasicMaterial({color:0x000000})); scene.add(el); m._edge=el;
  }
  return m;
}
const winMesh=buildCtx('window',0x2a3b52,0.92);
const massMesh=buildCtx('mass',0x9298a0,1.0);   // medium gray massing
// massing brep edges as black lines (clean face boundaries, no mesh diagonals)
let massEdgeLines=null;
if(D.mass_edges && D.mass_edges.length){
  const ep=new Float32Array(D.mass_edges.length*6);
  D.mass_edges.forEach((e,i)=>{for(let k=0;k<6;k++)ep[i*6+k]=e[k];});
  const eg=new THREE.BufferGeometry(); eg.setAttribute('position',new THREE.BufferAttribute(ep,3));
  massEdgeLines=new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x000000}));
  scene.add(massEdgeLines);
  if(massMesh) massMesh._edge2=massEdgeLines;
}
let dispWire=false, winOn=true, massOn=true;
const WIRECOL=0x9499a0;   // medium-gray wireframe lines
function refresh(){
  mesh.visible=true; eline.visible=true;                 // panels: always solid (color)
  if(winMesh){
    winMesh.visible=winOn && !dispWire;                  // windows: solid (shade) / wire (hidden)
    if(winMesh._edge){winMesh._edge.visible=winOn;
      winMesh._edge.material.color.set(dispWire?WIRECOL:0x000000);}
  }
  if(massMesh){
    massMesh.visible=massOn && !dispWire;                // mass: solid (shade) / wire (hidden)
    if(massMesh._edge2){massMesh._edge2.visible=massOn;
      massMesh._edge2.material.color.set(dispWire?WIRECOL:0x000000);}
  }
}
document.getElementById('tgWin').addEventListener('click',function(){
  this.classList.toggle('on'); winOn=this.classList.contains('on'); refresh();});
document.getElementById('tgMass').addEventListener('click',function(){
  this.classList.toggle('on'); massOn=this.classList.contains('on'); refresh();});
document.getElementById('dispShade').addEventListener('click',function(){
  dispWire=false; this.classList.add('on'); document.getElementById('dispWire').classList.remove('on'); refresh();});
document.getElementById('dispWire').addEventListener('click',function(){
  dispWire=true; this.classList.add('on'); document.getElementById('dispShade').classList.remove('on'); refresh();});
// dim context (massing + windows) while a panel/block is spotlighted
function dimContext(on){
  if(massMesh){const m=massMesh.material; m.transparent=true; m.opacity=on?0.16:1; m.depthWrite=!on;
    if(massMesh._edge2){const e=massMesh._edge2.material; e.transparent=true; e.opacity=on?0.2:1;}}
  if(winMesh){const m=winMesh.material; m.transparent=true; m.opacity=on?0.14:0.92;
    if(winMesh._edge){const e=winMesh._edge.material; e.transparent=true; e.opacity=on?0.2:1;}}
}

// --- inset: single selected kit object, auto-rotating ---
const ibox=document.getElementById('insetbox');
const rnd2=new THREE.WebGLRenderer({canvas:document.getElementById('inset'),antialias:true,alpha:true});
rnd2.setSize(230,230); rnd2.setPixelRatio(devicePixelRatio);
const sc2=new THREE.Scene();
const cam2=new THREE.PerspectiveCamera(38,1,0.1,1000);
sc2.add(new THREE.AmbientLight(0xffffff,0.6));
const dl3=new THREE.DirectionalLight(0xffffff,0.85); dl3.position.set(40,60,50); sc2.add(dl3);
const ctrl2=new THREE.OrbitControls(cam2,document.getElementById('inset'));
ctrl2.enableDamping=true; ctrl2.autoRotate=true; ctrl2.autoRotateSpeed=2.2; ctrl2.enablePan=false;
let insetGroup=null;
function showInset(item,mode){
  if(insetGroup){sc2.remove(insetGroup);}
  insetGroup=new THREE.Group();
  // block mode -> show the whole block instance (its panels/fins); else single item
  let items=[item];
  if(mode===2){
    const ik = item.fin ? 'ginst' : 'inst';
    const iv = item[ik];
    items = (item.fin?D.fins:D.panels).filter(p=>p[ik]===iv);
  }
  // center on combined bbox
  let mnx=1e9,mny=1e9,mnz=1e9,mxx=-1e9,mxy=-1e9,mxz=-1e9;
  items.forEach(it=>it.v.forEach(v=>{const x=v[0],y=v[2],z=-v[1];
    mnx=Math.min(mnx,x);mny=Math.min(mny,y);mnz=Math.min(mnz,z);
    mxx=Math.max(mxx,x);mxy=Math.max(mxy,y);mxz=Math.max(mxz,z);}));
  const cx=(mnx+mxx)/2,cy=(mny+mxy)/2,cz=(mnz+mxz)/2;
  items.forEach(it=>{
    const n=it.v.length, pos=new Float32Array(n*3);
    it.v.forEach((v,i)=>{pos[i*3]=v[0]-cx;pos[i*3+1]=v[2]-cy;pos[i*3+2]=-v[1]-cz;});
    const ix=[]; it.t.forEach(t=>ix.push(t[0],t[1],t[2]));
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setIndex(ix); g.computeVertexNormals();
    const c=colOf(it,mode);
    insetGroup.add(new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:new THREE.Color(c[0],c[1],c[2]),
      roughness:0.6,metalness:0.05,flatShading:true,side:THREE.DoubleSide})));
    insetGroup.add(new THREE.LineSegments(new THREE.EdgesGeometry(g,25),
      new THREE.LineBasicMaterial({color:0x0a0d12})));
  });
  sc2.add(insetGroup);
  const r=Math.max(mxx-mnx,mxy-mny,mxz-mnz)*0.6+0.5;
  cam2.position.set(r*1.6,r*1.1,r*2.0); ctrl2.target.set(0,0,0); ctrl2.update();
  ibox.style.display='block';
}
function hideInset(){ibox.style.display='none';}

(function loop(){requestAnimationFrame(loop);ctrl.update();rnd.render(scene,cam);
  if(insetGroup && ibox.style.display!=='none'){ctrl2.update(); rnd2.render(sc2,cam2);}
})();
</script></body></html>
