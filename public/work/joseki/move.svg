<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc"><title id="title">What is a Move?</title><desc id="desc">A reusable function with context, rather than an unexplained copied fragment. Conceptual anatomy: available information depends on the candidate and its review state.</desc><rect width="1440" height="720" fill="#f3f1ec"/><g font-family="Arial,Helvetica,sans-serif" fill="#20302d"><text x="64" y="65" font-size="15" letter-spacing="3">joseki / MOVE</text><text x="64" y="139" font-size="44" font-weight="700">What is a Move?</text><text x="64" y="185" font-size="22" fill="#68716d">A reusable function with context, rather than an unexplained copied fragment.</text><rect x="64" y="250" width="410" height="300" rx="12" fill="#ffffff"/><text x="92" y="294" font-size="16" fill="#d75b42">01</text><text x="92" y="338" font-size="19" font-weight="700" fill="#20302d">SOURCE &amp; IDENTITY</text><circle cx="94" cy="385" r="3" fill="#d75b42"/><text x="108" y="391" font-size="18" fill="#20302d">Original definition and repository</text><circle cx="94" cy="430" r="3" fill="#d75b42"/><text x="108" y="436" font-size="18" fill="#20302d">Source version and package identity</text><circle cx="94" cy="475" r="3" fill="#d75b42"/><text x="108" y="481" font-size="18" fill="#20302d">Traceable implementation</text><path d="M 483 407 h 22 m -8 -7 l 8 7 -8 7" fill="none" stroke="#d75b42" stroke-width="2"/><rect x="514" y="250" width="410" height="300" rx="12" fill="#20302d"/><text x="542" y="294" font-size="16" fill="#d75b42">02</text><text x="542" y="338" font-size="19" font-weight="700" fill="#ffffff">FUNCTION &amp; INTERFACE</text><circle cx="544" cy="385" r="3" fill="#d75b42"/><text x="558" y="391" font-size="18" fill="#ffffff">Connected component selection</text><circle cx="544" cy="430" r="3" fill="#d75b42"/><text x="558" y="436" font-size="18" fill="#ffffff">Inputs, outputs, and internal wires</text><circle cx="544" cy="475" r="3" fill="#d75b42"/><text x="558" y="481" font-size="18" fill="#ffffff">Stored settings and data</text><path d="M 933 407 h 22 m -8 -7 l 8 7 -8 7" fill="none" stroke="#d75b42" stroke-width="2"/><rect x="964" y="250" width="410" height="300" rx="12" fill="#ffffff"/><text x="992" y="294" font-size="16" fill="#d75b42">03</text><text x="992" y="338" font-size="19" font-weight="700" fill="#20302d">EVIDENCE &amp; REUSE</text><circle cx="994" cy="385" r="3" fill="#d75b42"/><text x="1008" y="391" font-size="18" fill="#20302d">Recorded test inputs and outputs</text><circle cx="994" cy="430" r="3" fill="#d75b42"/><text x="1008" y="436" font-size="18" fill="#20302d">Review scope and example references</text><circle cx="994" cy="475" r="3" fill="#d75b42"/><text x="1008" y="481" font-size="18" fill="#20302d">Ready status only when qualified</text><line x1="64" y1="600" x2="1376" y2="600" stroke="#d9dcd5"/><text x="64" y="645" font-size="19">Conceptual anatomy: available information depends on the candidate and its review state.</text></g></svg>