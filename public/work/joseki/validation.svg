<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc"><title id="title">Prepared does not mean verified</title><desc id="desc">Separate the ability to package a function from evidence that it works. Changed source or package evidence must be checked again. Unsupported cases remain outside Ready.</desc><rect width="1440" height="720" fill="#f3f1ec"/><g font-family="Arial,Helvetica,sans-serif" fill="#20302d"><text x="64" y="65" font-size="15" letter-spacing="3">joseki / VALIDATION</text><text x="64" y="139" font-size="44" font-weight="700">Prepared does not mean verified</text><text x="64" y="185" font-size="22" fill="#68716d">Separate the ability to package a function from evidence that it works.</text><rect x="64" y="250" width="410" height="300" rx="12" fill="#ffffff"/><text x="92" y="294" font-size="16" fill="#d75b42">01</text><text x="92" y="338" font-size="19" font-weight="700" fill="#20302d">DISCOVER + PREPARE</text><circle cx="94" cy="385" r="3" fill="#d75b42"/><text x="108" y="391" font-size="18" fill="#20302d">Identify a candidate</text><circle cx="94" cy="430" r="3" fill="#d75b42"/><text x="108" y="436" font-size="18" fill="#20302d">Check dependencies and boundaries</text><circle cx="94" cy="475" r="3" fill="#d75b42"/><text x="108" y="481" font-size="18" fill="#20302d">Preserve an archive package</text><path d="M 483 407 h 22 m -8 -7 l 8 7 -8 7" fill="none" stroke="#d75b42" stroke-width="2"/><rect x="514" y="250" width="410" height="300" rx="12" fill="#20302d"/><text x="542" y="294" font-size="16" fill="#d75b42">02</text><text x="542" y="338" font-size="19" font-weight="700" fill="#ffffff">EXECUTE + REVIEW</text><circle cx="544" cy="385" r="3" fill="#d75b42"/><text x="558" y="391" font-size="18" fill="#ffffff">Run supported fixture cases</text><circle cx="544" cy="430" r="3" fill="#d75b42"/><text x="558" y="436" font-size="18" fill="#ffffff">Check values and data-tree paths</text><circle cx="544" cy="475" r="3" fill="#d75b42"/><text x="558" y="481" font-size="18" fill="#ffffff">Bind results to exact versions</text><path d="M 933 407 h 22 m -8 -7 l 8 7 -8 7" fill="none" stroke="#d75b42" stroke-width="2"/><rect x="964" y="250" width="410" height="300" rx="12" fill="#ffffff"/><text x="992" y="294" font-size="16" fill="#d75b42">03</text><text x="992" y="338" font-size="19" font-weight="700" fill="#20302d">READY FOR SCOPED REUSE</text><circle cx="994" cy="385" r="3" fill="#d75b42"/><text x="1008" y="391" font-size="18" fill="#20302d">Publish qualifying reviewed Moves</text><circle cx="994" cy="430" r="3" fill="#d75b42"/><text x="1008" y="436" font-size="18" fill="#20302d">Expose examples and conditions</text><circle cx="994" cy="475" r="3" fill="#d75b42"/><text x="1008" y="481" font-size="18" fill="#20302d">Keep untested work in review</text><line x1="64" y1="600" x2="1376" y2="600" stroke="#d9dcd5"/><text x="64" y="645" font-size="19">Changed source or package evidence must be checked again. Unsupported cases remain outside Ready.</text></g></svg>