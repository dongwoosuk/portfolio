<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc"><title id="title">From past projects to reusable moves</title><desc id="desc">A source-linked library for Grasshopper practice. A reusable function stays connected to the project knowledge it came from.</desc><rect width="1440" height="720" fill="#f3f1ec"/><g font-family="Arial,Helvetica,sans-serif" fill="#20302d"><text x="64" y="65" font-size="15" letter-spacing="3">joseki / OVERVIEW</text><text x="64" y="139" font-size="44" font-weight="700">From past projects to reusable moves</text><text x="64" y="185" font-size="22" fill="#68716d">A source-linked library for Grasshopper practice.</text><rect x="64" y="250" width="410" height="300" rx="12" fill="#ffffff"/><text x="92" y="294" font-size="16" fill="#d75b42">01</text><text x="92" y="338" font-size="19" font-weight="700" fill="#20302d">PROJECT KNOWLEDGE</text><circle cx="94" cy="385" r="3" fill="#d75b42"/><text x="108" y="391" font-size="18" fill="#20302d">Existing .gh / .ghx files</text><circle cx="94" cy="430" r="3" fill="#d75b42"/><text x="108" y="436" font-size="18" fill="#20302d">Useful logic inside large graphs</text><circle cx="94" cy="475" r="3" fill="#d75b42"/><text x="108" y="481" font-size="18" fill="#20302d">Different projects and versions</text><path d="M 483 407 h 22 m -8 -7 l 8 7 -8 7" fill="none" stroke="#d75b42" stroke-width="2"/><rect x="514" y="250" width="410" height="300" rx="12" fill="#20302d"/><text x="542" y="294" font-size="16" fill="#d75b42">02</text><text x="542" y="338" font-size="19" font-weight="700" fill="#ffffff">joseki</text><circle cx="544" cy="385" r="3" fill="#d75b42"/><text x="558" y="391" font-size="18" fill="#ffffff">Discover candidate functions</text><circle cx="544" cy="430" r="3" fill="#d75b42"/><text x="558" y="436" font-size="18" fill="#ffffff">Preserve source and boundaries</text><circle cx="544" cy="475" r="3" fill="#d75b42"/><text x="558" y="481" font-size="18" fill="#ffffff">Prepare, test, and review</text><path d="M 933 407 h 22 m -8 -7 l 8 7 -8 7" fill="none" stroke="#d75b42" stroke-width="2"/><rect x="964" y="250" width="410" height="300" rx="12" fill="#ffffff"/><text x="992" y="294" font-size="16" fill="#d75b42">03</text><text x="992" y="338" font-size="19" font-weight="700" fill="#20302d">DESIGNER WORKFLOW</text><circle cx="994" cy="385" r="3" fill="#d75b42"/><text x="1008" y="391" font-size="18" fill="#20302d">Find a relevant Move</text><circle cx="994" cy="430" r="3" fill="#d75b42"/><text x="1008" y="436" font-size="18" fill="#20302d">Inspect scope and examples</text><circle cx="994" cy="475" r="3" fill="#d75b42"/><text x="1008" y="481" font-size="18" fill="#20302d">Insert into a new canvas</text><line x1="64" y1="600" x2="1376" y2="600" stroke="#d9dcd5"/><text x="64" y="645" font-size="19">A reusable function stays connected to the project knowledge it came from.</text></g></svg>