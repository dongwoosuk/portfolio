<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc"><title id="title">A designer stays in control</title><desc id="desc">Explore &gt; View Move &gt; Library &gt; Insert Move into Canvas Passing an example is evidence for that example, not approval for every future design condition.</desc><rect width="1440" height="720" fill="#f3f1ec"/><g font-family="Arial,Helvetica,sans-serif" fill="#20302d"><text x="64" y="65" font-size="15" letter-spacing="3">joseki / WORKFLOW</text><text x="64" y="139" font-size="44" font-weight="700">A designer stays in control</text><text x="64" y="185" font-size="22" fill="#68716d">Explore &gt; View Move &gt; Library &gt; Insert Move into Canvas</text><rect x="64" y="250" width="410" height="300" rx="12" fill="#ffffff"/><text x="92" y="294" font-size="16" fill="#d75b42">01</text><text x="92" y="338" font-size="19" font-weight="700" fill="#20302d">FIND &amp; UNDERSTAND</text><circle cx="94" cy="385" r="3" fill="#d75b42"/><text x="108" y="391" font-size="18" fill="#20302d">Browse by function and source</text><circle cx="94" cy="430" r="3" fill="#d75b42"/><text x="108" y="436" font-size="18" fill="#20302d">Read the contribution and interface</text><circle cx="94" cy="475" r="3" fill="#d75b42"/><text x="108" y="481" font-size="18" fill="#20302d">Check the recorded reuse scope</text><path d="M 483 407 h 22 m -8 -7 l 8 7 -8 7" fill="none" stroke="#d75b42" stroke-width="2"/><rect x="514" y="250" width="410" height="300" rx="12" fill="#20302d"/><text x="542" y="294" font-size="16" fill="#d75b42">02</text><text x="542" y="338" font-size="19" font-weight="700" fill="#ffffff">INSPECT AN EXAMPLE</text><circle cx="544" cy="385" r="3" fill="#d75b42"/><text x="558" y="391" font-size="18" fill="#ffffff">Open a standalone test example</text><circle cx="544" cy="430" r="3" fill="#d75b42"/><text x="558" y="436" font-size="18" fill="#ffffff">See known inputs and outputs</text><circle cx="544" cy="475" r="3" fill="#d75b42"/><text x="558" y="481" font-size="18" fill="#ffffff">Understand the connected logic</text><path d="M 933 407 h 22 m -8 -7 l 8 7 -8 7" fill="none" stroke="#d75b42" stroke-width="2"/><rect x="964" y="250" width="410" height="300" rx="12" fill="#ffffff"/><text x="992" y="294" font-size="16" fill="#d75b42">03</text><text x="992" y="338" font-size="19" font-weight="700" fill="#20302d">INSERT &amp; CONTINUE</text><circle cx="994" cy="385" r="3" fill="#d75b42"/><text x="1008" y="391" font-size="18" fill="#20302d">Insert the selected Move</text><circle cx="994" cy="430" r="3" fill="#d75b42"/><text x="1008" y="436" font-size="18" fill="#20302d">Connect project-specific inputs</text><circle cx="994" cy="475" r="3" fill="#d75b42"/><text x="1008" y="481" font-size="18" fill="#20302d">Review behavior in the new context</text><line x1="64" y1="600" x2="1376" y2="600" stroke="#d9dcd5"/><text x="64" y="645" font-size="19">Passing an example is evidence for that example, not approval for every future design condition.</text></g></svg>